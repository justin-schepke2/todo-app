<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple to-do list that saves your tasks in your browser." />
  <title>To-Do List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><path d='M28 52l15 15 30-32' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <!-- Form for adding a new task -->
    <form id="task-form" class="task-form">
      <input
        id="task-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        aria-label="New task"
      />
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <!-- Filter buttons -->
    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- The list of tasks is drawn here by script.js -->
    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message">No tasks here yet.</p>

    <footer class="footer">
      <span id="task-count">0 tasks left</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
